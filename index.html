<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuratore Prompt Transformer - Semplificato</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            margin: 0;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            border: 1px solid var(--border);
        }

        h1, h2 {
            margin-top: 0;
            color: var(--text);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            font-size: 0.875rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .output-box {
            position: sticky;
            top: 2rem;
        }

        textarea {
            width: 100%;
            height: 380px;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            font-family: inherit;
            font-size: 0.875rem;
            resize: vertical;
            box-sizing: border-box;
            background-color: var(--bg);
            line-height: 1.6;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Colonna dei campi di input -->
        <div class="card">
            <h2>Impostazioni Rapide</h2>
            <p style="color: var(--text-light); font-size: 0.875rem; margin-bottom: 1.5rem;">
                Compila i 4 campi qui sotto. Il resto del prompt si adatterà automaticamente in modo coerente.
            </p>
            <form id="promptForm">
                <div class="form-group">
                    <label>Modello del Veicolo</label>
                    <input type="text" id="modello" placeholder="es: Maggiolino Volkswagen, Vespa 50 Special...">
                </div>
                <div class="form-group">
                    <label>Colore (in inglese)</label>
                    <input type="text" id="colore" placeholder="es: bright blue, matte black, cherry red...">
                </div>
                <div class="form-group">
                    <label>Numero di Ruote</label>
                    <input type="number" id="ruote" placeholder="es: 2, 3, 4...">
                </div>
                <div class="form-group">
                    <label>Targa</label>
                    <input type="text" id="targa" placeholder="es: MI 1974, RM 8273...">
                </div>
            </form>
        </div>

        <!-- Colonna dell'output -->
        <div class="output-box">
            <div class="card">
                <h2>Prompt Generato</h2>
                <textarea id="output" readonly></textarea>
                <button onclick="copyToClipboard()">Copia Prompt</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Prompt copiato negli appunti!</div>

    <script>
        const inputs = document.querySelectorAll('input');
        const output = document.getElementById('output');

        function updatePrompt() {
            // Recupera i valori o imposta i placeholder
            const modello = document.getElementById('modello').value.trim() || '[MODELLO]';
            const colore = document.getElementById('colore').value.trim() || '[COLORE]';
            const ruote = document.getElementById('ruote').value.trim() || '[NUMERO]';
            const targa = document.getElementById('targa').value.trim() || '[TARGA]';

            // Crea versioni in maiuscolo per i titoli
            const modelloCaps = modello !== '[MODELLO]' ? modello.toUpperCase() : '[MODELLO MAIUSCOLO]';

            // Genera il prompt con la logica integrata per far quadrare le frasi
            const result = `A detailed, high-resolution diptych photograph displaying two panels side-by-side, detailing a ${modello} Transformer concept, with a strong emphasis on mechanical coherence. The left panel shows a classic, vintage ${colore} vehicle parked on a cobblestone street in a historic Italian borgo, "Borgo Vecchio". The vehicle features a distinct round front headlight, mounted on the front grill. Its small rear cargo bed holds vintage luggage on a custom rack. Its small Italian license plate reads "${targa}". All of its original wheels (${ruote} wheels) are visible. Text below reads: "FORMA VEICOLO (${modelloCaps} - ${ruote} RUOTE) - FANALE VINTAGE". The right panel, in the same cobblestone street setting, features the ${modello} transformed into a complex, standing humanoid mechanical robot. The robot is built from the ${modello}'s panels and mechanical parts, and its entire structure incorporates *all* of the vehicle's wheels (integrated perfectly into its mechanical joints and limbs). A large round sensor/light is centrally located on the robot's chest, matching the vehicle's headlight. The robot's armor clearly uses the ${colore} bodywork. Text below reads: "FORMA ROBOT (CON ${ruote} RUOTE VISIBILI E FANALE COERENTE)". A main title banner above both panels reads: "${modelloCaps} TRANSFORMER: MECCANICA E COERENZA". Both panels include the same background of stone buildings, terracotta pots with plants, and warm, diffused daylight.`;

            output.value = result;
        }

        // Aggiungi event listener a tutti gli input per aggiornamento in tempo reale
        inputs.forEach(input => {
            input.addEventListener('input', updatePrompt);
        });

        // Genera il prompt iniziale all'avvio
        updatePrompt();

        // Funzione per copiare negli appunti
        function copyToClipboard() {
            output.select();
            document.execCommand('copy');
            
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
            
            window.getSelection().removeAllRanges();
        }
    </script>
</body>
</html>
