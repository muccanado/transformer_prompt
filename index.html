<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuratore Prompt Transformer</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            margin: 0;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            border: 1px solid var(--border);
        }

        h1, h2 {
            margin-top: 0;
            color: var(--text);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
            color: var(--text);
        }

        input[type="text"] {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            font-size: 0.875rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .output-box {
            position: sticky;
            top: 2rem;
        }

        textarea {
            width: 100%;
            height: 400px;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            font-family: inherit;
            font-size: 0.875rem;
            resize: vertical;
            box-sizing: border-box;
            background-color: var(--bg);
            line-height: 1.6;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Colonna dei campi di input -->
        <div class="card">
            <h2>Parametri Veicolo</h2>
            <form id="promptForm">
                <div class="form-group">
                    <label>Nome del Veicolo</label>
                    <input type="text" id="NOME_DEL_VEICOLO" placeholder="es: Maggiolino Volkswagen">
                </div>
                <div class="form-group">
                    <label>Colore e Tipo del Veicolo (in inglese)</label>
                    <input type="text" id="COLORE_E_TIPO_DEL_VEICOLO" placeholder="es: vintage, bright blue classic sedan">
                </div>
                <div class="form-group">
                    <label>Tipo del Veicolo (in inglese)</label>
                    <input type="text" id="TIPO_DEL_VEICOLO" placeholder="es: micro-car">
                </div>
                <div class="form-group">
                    <label>Forma del Fanale (in inglese)</label>
                    <input type="text" id="FORMA_DEL_FANALE" placeholder="es: round">
                </div>
                <div class="form-group">
                    <label>Carico Opzionale (in inglese)</label>
                    <input type="text" id="CARICO_OPZIONALE" placeholder="es: a small suitcase on a rear rack">
                </div>
                <div class="form-group">
                    <label>Targa Opzionale</label>
                    <input type="text" id="TARGA_OPZIONALE" placeholder="es: MI 1974">
                </div>
                <div class="form-group">
                    <label>Dettaglio Ruote (in inglese)</label>
                    <input type="text" id="O_ALTRO_NUMERO_DI_RUOTE" placeholder="es: four wheels">
                </div>
                <div class="form-group">
                    <label>Numero di Ruote (cifra)</label>
                    <input type="text" id="NUMERO_DI_RUOTE" placeholder="es: 4">
                </div>
                <div class="form-group">
                    <label>Fanale e Forma (MAIUSCOLO)</label>
                    <input type="text" id="FANALE_E_FORMA" placeholder="es: FANALE TONDO">
                </div>
                <div class="form-group">
                    <label>Modello del Veicolo (MAIUSCOLO)</label>
                    <input type="text" id="MODELLO_DEL_VEICOLO" placeholder="es: BEETLE 1303">
                </div>
                <div class="form-group">
                    <label>Nome Veicolo Capitalizzato (Titolo)</label>
                    <input type="text" id="NOME_DEL_VEICOLO_CAPITALIZZATO" placeholder="es: VW BEETLE">
                </div>
                <div class="form-group">
                    <label>Colore del Veicolo (in inglese)</label>
                    <input type="text" id="COLORE_DEL_VEICOLO" placeholder="es: bright blue">
                </div>
                <div class="form-group">
                    <label>Posizione Ruote sul Robot (in inglese)</label>
                    <input type="text" id="DOVE_SONO_LE_RUOTE_SUL_ROBOT" placeholder="es: on the ankles of its feet and integrated into its shoulders">
                </div>
            </form>
        </div>

        <!-- Colonna dell'output -->
        <div class="output-box">
            <div class="card">
                <h2>Prompt Generato</h2>
                <textarea id="output" readonly></textarea>
                <button onclick="copyToClipboard()">Copia Prompt</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Prompt copiato negli appunti!</div>

    <script>
        const template = `A detailed, high-resolution diptych photograph displaying two panels side-by-side, detailing a [NOME_DEL_VEICOLO] Transformer concept, with a strong emphasis on mechanical coherence. The left panel shows a classic, vintage [COLORE_E_TIPO_DEL_VEICOLO] parked on a cobblestone street in a historic Italian borgo, "Borgo Vecchio". The [TIPO_DEL_VEICOLO] features a distinct [FORMA_DEL_FANALE] front headlight, mounted on the front grill. Its small rear cargo bed holds [CARICO_OPZIONALE]. Its small Italian license plate reads "[TARGA_OPZIONALE]". All of its original wheels (one front, two rear, [O_ALTRO_NUMERO_DI_RUOTE]) are visible. Text below reads: "FORMA VEICOLO ([MODELLO_DEL_VEICOLO] - [NUMERO_DI_RUOTE] RUOTE) - [FANALE_E_FORMA]". The right panel, in the same cobblestone street setting, features the [NOME_DEL_VEICOLO] transformed into a complex, standing humanoid mechanical robot. The robot is built from the [NOME_DEL_VEICOLO]'s panels and mechanical parts, and its entire structure incorporates *all* of the vehicle's wheels (e.g., [DOVE_SONO_LE_RUOTE_SUL_ROBOT]). A large [FORMA_DEL_FANALE] sensor/light is centrally located on the robot's chest, matching the vehicle's headlight. The robot's armor clearly uses the [COLORE_DEL_VEICOLO] bodywork. Text below reads: "FORMA ROBOT (CON [NUMERO_DI_RUOTE] RUOTE VISIBILI E [FANALE_E_FORMA] COERENTE)". A main title banner above both panels reads: "[NOME_DEL_VEICOLO_CAPITALIZZATO] TRANSFORMER: MECCANICA E COERENZA". Both panels include the same background of stone buildings, terracotta pots with plants, and warm, diffused daylight.`;

        const inputs = document.querySelectorAll('input');
        const output = document.getElementById('output');

        // Funzione per aggiornare il prompt
        function updatePrompt() {
            let result = template;
            
            inputs.forEach(input => {
                // Usa il valore inserito o, se vuoto, mantieni il placeholder tra parentesi quadre
                const value = input.value.trim() !== '' ? input.value : `[${input.id}]`;
                
                // Crea una RegExp globale per sostituire tutte le occorrenze di quel tag
                const regex = new RegExp(`\\[${input.id}\\]`, 'g');
                result = result.replace(regex, value);
            });

            output.value = result;
        }

        // Aggiungi event listener a tutti gli input per aggiornamento in tempo reale
        inputs.forEach(input => {
            input.addEventListener('input', updatePrompt);
        });

        // Genera il prompt iniziale (con i placeholder) all'avvio
        updatePrompt();

        // Funzione per copiare negli appunti
        function copyToClipboard() {
            output.select();
            document.execCommand('copy');
            
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
            
            // Deseleziona il testo
            window.getSelection().removeAllRanges();
        }
    </script>
</body>
</html>
